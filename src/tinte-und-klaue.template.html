   3. HILFSFUNKTIONEN

const zufall = (a, b) => a + Math.random() * (b - a);
const begrenze = (v, a, b) => Math.max(a, Math.min(b, v));
const ueberlappt = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const waehle = arr => arr[Math.floor(Math.random() * arr.length)];
function mischen(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function saatZufall(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const leinwand = document.getElementById('spiel');
const ctx = leinwand.getContext('2d');

function neueLeinwand(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Text mit schwarzer Kontur (Siebdruck-Look)
function text(str, x, y, groesse, farbe = '#fff', ausr = 'center', kontur = 6, c = ctx) {
  c.font = `${groesse}px ${SCHRIFT}`;
  c.textAlign = ausr; c.textBaseline = 'middle';
  if (kontur) { c.lineJoin = 'round'; c.lineWidth = kontur; c.strokeStyle = '#000'; c.strokeText(str, x, y); }
  c.fillStyle = farbe; c.fillText(str, x, y);
}

// Tintenklecks: Hauptfleck + Spritzer (zufällig, aber per Seed reproduzierbar)
function klecks(c, x, y, r, farbe, seed = 1) {
  const rnd = saatZufall(seed);
  c.fillStyle = farbe;
  c.beginPath();
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const w = i / n * Math.PI * 2, rr = r * (0.75 + rnd() * 0.45);
    const px = x + Math.cos(w) * rr, py = y + Math.sin(w) * rr;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.fill();
  for (let i = 0; i < 12; i++) {
    const w = rnd() * Math.PI * 2, d = r * (1.1 + rnd() * 1.4), rr = r * (0.05 + rnd() * 0.16);
    c.beginPath(); c.arc(x + Math.cos(w) * d, y + Math.sin(w) * d, rr, 0, Math.PI * 2); c.fill();
    if (rnd() < 0.5) { c.lineWidth = rr * 0.8; c.strokeStyle = farbe; c.beginPath(); c.moveTo(x + Math.cos(w) * r * 0.8, y + Math.sin(w) * r * 0.8); c.lineTo(x + Math.cos(w) * d, y + Math.sin(w) * d); c.stroke(); }
  }
}

const kopie = o => JSON.parse(JSON.stringify(o));
let spielstand = { einstellungen: { schwierigkeit: 'mittel', musik: 0.5, effekte: 0.8, stumm: false, debug: false }, tasten: kopie(STANDARD_TASTEN), statistik: { siege: {}, arcade: {}, kaempfe: 0 } };
function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return;
    const d = JSON.parse(roh);
    Object.assign(spielstand.einstellungen, d.einstellungen || {});
    if (d.tasten && d.tasten.p1 && d.tasten.p2) {
      for (const p of ['p1', 'p2']) for (const a of AKTIONEN) if (Array.isArray(d.tasten[p][a]) && d.tasten[p][a].length) spielstand.tasten[p][a] = d.tasten[p][a];
    }
    if (d.statistik) spielstand.statistik = Object.assign(spielstand.statistik, d.statistik);
  } catch (e) { /* localStorage nicht verfügbar – dann eben ohne Speichern */ }
}
function speichern() { try { localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(spielstand)); } catch (e) { } }

/* =====================================================================

const Klang = {
  ac: null, sfx: null, mus: null, rausch: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.connect(this.ac.destination);
      this.sfx = this.ac.createGain(); this.sfx.connect(this.master);
      this.mus = this.ac.createGain(); this.mus.connect(this.master);
      const len = this.ac.sampleRate;
      this.rausch = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.rausch.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const verz = this.ac.createWaveShaper(); const k = 30, n = 256, kurve = new Float32Array(n);
      for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; kurve[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x)); }
      verz.curve = kurve; this.verzerrer = verz; verz.connect(this.sfx);
      this.lautstaerke();
      Musik.start();
    } catch (e) { this.ac = null; }
  },
  lautstaerke() {
    if (!this.ac) return;
    const e = spielstand.einstellungen;
    this.master.gain.value = e.stumm ? 0 : 1;
    this.sfx.gain.value = e.effekte;
    this.mus.gain.value = e.musik * 0.5;
  },
  ton(f, dauer, typ = 'square', vol = 0.3, bis = null, ziel = null, wann = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + wann;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = typ; o.frequency.setValueAtTime(f, t);
    if (bis) o.frequency.exponentialRampToValueAtTime(Math.max(1, bis), t + dauer);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    o.connect(g); g.connect(ziel || this.sfx); o.start(t); o.stop(t + dauer + 0.02);
  },
  rauschen(dauer, filter = 2000, vol = 0.3, typ = 'lowpass', bis = null, ziel = null, wann = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + wann;
    const s = this.ac.createBufferSource(); s.buffer = this.rausch;
    const f = this.ac.createBiquadFilter(); f.type = typ; f.frequency.setValueAtTime(filter, t);
    if (bis) f.frequency.exponentialRampToValueAtTime(bis, t + dauer);
    const g = this.ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    s.connect(f); f.connect(g); g.connect(ziel || this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dauer + 0.02);
  },
  spiele(name) {
    if (!this.ac) return;
    switch (name) {
      case 'menue': this.ton(660, 0.06, 'square', 0.12); break;
      case 'ok': this.ton(520, 0.07, 'square', 0.12); this.ton(780, 0.1, 'square', 0.12, null, null, 0.06); break;
      case 'zurueck': this.ton(400, 0.08, 'square', 0.1, 250); break;
      case 'schlag': this.rauschen(0.08, 3000, 0.25, 'bandpass', 800); break;
      case 'treffer': this.rauschen(0.1, 1600, 0.45); this.ton(150, 0.12, 'sine', 0.5, 60); break;
      case 'trefferHart': this.rauschen(0.2, 1200, 0.6); this.ton(110, 0.25, 'sine', 0.7, 40); this.ton(70, 0.2, 'square', 0.15, 35); break;
      case 'block': this.ton(1200, 0.05, 'square', 0.12, 700); this.rauschen(0.06, 5000, 0.2, 'highpass'); break;
      case 'sprung': this.ton(280, 0.12, 'triangle', 0.18, 560); break;
      case 'ko': this.ton(420, 1.0, 'sawtooth', 0.25, 40); this.rauschen(0.8, 900, 0.4, 'lowpass', 100); break;
      case 'super': this.ton(110, 0.9, 'sawtooth', 0.2, 220); this.ton(165, 0.9, 'sawtooth', 0.15, 330); this.rauschen(0.5, 400, 0.3, 'bandpass', 4000); break;
      case 'runde': this.ton(330, 0.15, 'square', 0.15); this.ton(440, 0.25, 'square', 0.15, null, null, 0.15); break;
      case 'kampf': this.ton(220, 0.4, 'sawtooth', 0.2, 440); this.rauschen(0.3, 3000, 0.2, 'highpass'); break;
      case 'bass': this.ton(55, 0.6, 'sawtooth', 0.45, 45, this.verzerrer); this.ton(110, 0.3, 'sine', 0.4, 55); break;
      case 'gitarre': [82.4, 123.5, 164.8].forEach((f, i) => this.ton(f, 0.9, 'sawtooth', 0.12, f * 0.98, this.verzerrer, i * 0.015)); break;
      case 'laser': this.ton(180, 0.35, 'sawtooth', 0.16, 900); this.ton(900, 0.3, 'sine', 0.12, 300); break;
      case 'bruell': this.rauschen(0.55, 500, 0.5, 'lowpass', 150); this.ton(95, 0.5, 'sawtooth', 0.2, 60, this.verzerrer); break;
    }
  }
};

// Einfache Hintergrundmusik: Am – F – G – E, Bass + Schlagzeug, per Lookahead-Scheduler
const Musik = {
  schritt: 0, zeit: 0, modus: 'menue', timer: null,
  start() {
    if (!Klang.ac || this.timer) return;
    this.zeit = Klang.ac.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  tick() {
    const ac = Klang.ac; if (!ac) return;
    const tempo = this.modus === 'kampf' ? 132 : 100;
    const sechzehntel = 60 / tempo / 4;
    while (this.zeit < ac.currentTime + 0.12) {
      this.schritt16(this.schritt, this.zeit);
      this.zeit += sechzehntel; this.schritt = (this.schritt + 1) % 64;
    }
  },
  schritt16(s, t) {
    const ac = Klang.ac, ziel = Klang.mus;
    const takt = Math.floor(s / 16), pos = s % 16;
    const grund = [55, 43.65, 49, 41.2][takt];
    const kampf = this.modus === 'kampf';
    const note = (f, d, typ, vol) => { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = kampf ? 900 : 600;
      o.type = typ; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(fl); fl.connect(g); g.connect(ziel); o.start(t); o.stop(t + d + 0.02); };
    const trommel = (f, d, vol, rausch) => {
      if (rausch) { const s = ac.createBufferSource(); s.buffer = Klang.rausch; const fl = ac.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = rausch;
        const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); s.connect(fl); fl.connect(g); g.connect(ziel); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02); }
      else { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(40, t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(ziel); o.start(t); o.stop(t + d + 0.02); } };
    if (kampf) {
      if (pos % 4 === 0 || pos === 10) trommel(150, 0.18, 0.9);
      if (pos === 4 || pos === 12) trommel(0, 0.14, 0.35, 1500);
      if (pos % 2 === 0) trommel(0, 0.03, 0.12, 7000);
      const bassMuster = [1, 0, 1, 2, 1, 0, 1, 0, 1, 0, 1, 2, 1, 0, 1.5, 1];
      if (bassMuster[pos]) note(grund * bassMuster[pos], 0.14, 'sawtooth', 0.32);
      if (pos % 8 === 6) note(grund * 4 * [1, 1.2, 1.5][takt % 3], 0.25, 'square', 0.05);
    } else {
      if (pos === 0 || pos === 8) trommel(120, 0.25, 0.5);
      if (pos === 8) trommel(0, 0.1, 0.12, 2500);
      if (pos % 4 === 2) trommel(0, 0.03, 0.06, 8000);
      if (pos === 0 || pos === 6 || pos === 10) note(grund, 0.4, 'triangle', 0.4);
      const arp = [1, 1.19, 1.5, 2, 1.5, 1.19];
      if (pos % 2 === 0) note(grund * 4 * arp[(pos / 2) % arp.length], 0.18, 'triangle', 0.07);
    }
  }
};

const BILDER = {};      // rohe Bilder
const SPRITES = {};     // pro Charakter: normal, rot, weiss, schatten, portrait
let ladeFortschritt = 0, ladeFertig = false;

function ladeBilder() {
  const namen = Object.keys(BILDDATEIEN);
  let fertig = 0;
  return Promise.all(namen.map(n => new Promise(res => {
    const img = new Image();
    img.onload = () => { BILDER[n] = img; fertig++; ladeFortschritt = fertig / namen.length; res(); };
    img.onerror = () => { BILDER[n] = null; fertig++; ladeFortschritt = fertig / namen.length; res(); };
    img.src = (!BILDER_AUS_ORDNER && EINGEBETTETE_BILDER[n]) ? EINGEBETTETE_BILDER[n] : BILD_ORDNER + BILDDATEIEN[n];
  })));
}

// Platzhalter, falls ein Bild fehlt: Tintenklecks mit Name
function platzhalter(def) {
  const c = neueLeinwand(300, 440), g = c.getContext('2d');
  klecks(g, 150, 220, 110, '#333', def.name.length);
  text(def.name, 150, 220, 40, '#fff', 'center', 6, g);
  text('Bild fehlt', 150, 270, 22, ROT, 'center', 4, g);

}

function eingefaerbt(quelle, farbe, alpha) {
  const c = neueLeinwand(quelle.width, quelle.height), g = c.getContext('2d');
  g.drawImage(quelle, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = alpha; g.fillStyle = farbe; g.fillRect(0, 0, c.width, c.height);
  return c;
}

function bereiteSpritesVor() {
  for (const def of CHARAKTERE) {
    const img = BILDER[def.id];
    let normal;
    if (img) { normal = neueLeinwand(img.width, img.height); normal.getContext('2d').drawImage(img, 0, 0); }
    else normal = platzhalter(def);
    // Portrait: quadratischer Kopfausschnitt
    const p = neueLeinwand(160, 160), pg = p.getContext('2d');
    const grd = pg.createLinearGradient(0, 0, 0, 160); grd.addColorStop(0, '#3a3a3a'); grd.addColorStop(1, '#0c0c0c');
    pg.fillStyle = grd; pg.fillRect(0, 0, 160, 160);
    const s = def.portrait.s * normal.height;
    pg.drawImage(normal, def.portrait.cx * normal.width - s / 2, def.portrait.cy * normal.height - s / 2, s, s, 0, 0, 160, 160);
    SPRITES[def.id] = {
      normal, portrait: p,
      rot: eingefaerbt(normal, '#ff1010', 0.65),
      weiss: eingefaerbt(normal, '#ffffff', 0.85),
      schatten: eingefaerbt(normal, def.farbe, 0.9)
    };

  const s = new Set(['Space', 'Enter', 'Escape', 'Tab', 'Backspace']);

function tastenName(code) {

    ControlLeft: 'Strg L', ControlRight: 'Strg R', AltLeft: 'Alt', Semicolon: 'Ö', Quote: 'Ä', BracketLeft: 'Ü', Comma: ',', Period: '.', Slash: '-', Minus: 'ß' };
  if (m[code]) return m[code];

// Tastatur-Steuerung eines Spielers (mit kleinem Eingabepuffer)

/* =====================================================================
   8. KÜNSTLICHE INTELLIGENZ (Zustandsautomat)
   ===================================================================== */
class KISteuerung {
  constructor(stufe) { this.s = SCHWIERIGKEITEN[stufe] || SCHWIERIGKEITEN.mittel; this.halte = {}; this.plan = []; this.jetzt = {}; this.puffer = {}; this.denkTimer = 0; this.letzterAngriff = null; this.frame = 0; }
  gehalten(a) { return !!this.jetzt[a]; }
  nimm(a) { if (this.puffer[a]) { this.puffer[a] = 0; return true; } return false; }
  leeren() { this.puffer = {}; this.halte = {}; this.plan = []; }
  druecke(a, verz = 0) { this.plan.push({ f: this.frame + verz, a }); }
  halteFuer(a, n) { this.halte[a] = Math.max(this.halte[a] || 0, n); }
  richtungsTaste(ich, vor) { return (ich.richtung > 0) === vor ? 'rechts' : 'links'; }

  denke(ich, g, kampf) {
    this.frame++;
    for (const a in this.puffer) if (this.puffer[a] > 0) this.puffer[a]--;
    const s = this.s, dist = Math.abs(g.x - ich.x);
    // 1) Auf Angriffe reagieren (einmal pro gegnerischem Angriff würfeln)
    if (g.angriff && g.angriff !== this.letzterAngriff && ich.frei()) {
      this.letzterAngriff = g.angriff;
      const m = g.angriff.m;
      const reicht = m.hitbox === false ? dist < 500 : dist < (m.reichweite || 120) + 90;
      if (reicht && Math.random() < s.block && m.typ !== 'boden') {
        this.halte = {}; this.plan = [];
        const dauer = (m.start + (m.aktiv || 4)) - g.angriff.t + 8;
        this.halteFuer('block', Math.max(8, dauer));
        if (m.stufe === 'tief' && Math.random() < s.block + 0.1) this.halteFuer('runter', Math.max(8, dauer));
      } else if (m.typ === 'boden' && Math.random() < s.block + 0.2) {
        this.halte = {}; this.plan = []; this.druecke('hoch', Math.floor(zufall(8, 20)));
      }
    }
    // Projektile: springen oder blocken
    for (const p of kampf.geschosse) {
      if (p.besitzer === ich || p.gewarnt === ich) continue;
      const kommt = Math.sign(ich.x - p.x) === Math.sign(p.vx) && Math.abs(ich.x - p.x) < 260;
      if (kommt || p.art === 'bluete') {
        p.gewarnt = ich;
        if (Math.random() < s.block) {
          if (p.m.stufe === 'tief' && Math.random() < 0.5) this.druecke('hoch');
          else { this.halteFuer('block', 24); if (p.m.stufe === 'tief') this.halteFuer('runter', 24); }
        }
      }
    }
    // 2) Neue Entscheidung nach Denkpause
    if (--this.denkTimer <= 0 && ich.frei() && !this.halte.block) {
      this.denkTimer = s.denk + Math.floor(Math.random() * s.denk);
      this.entscheide(ich, g, dist, kampf);
    }
    // 3) Plan in Tasten umsetzen
    this.jetzt = {};
    for (const a in this.halte) { if (this.halte[a] > 0) { this.jetzt[a] = true; this.halte[a]--; } }
    this.plan = this.plan.filter(p => { if (p.f <= this.frame) { this.puffer[p.a] = 6; this.jetzt[p.a] = true; return false; } return true; });
  }

  entscheide(ich, g, dist, kampf) {
    const s = this.s, r = Math.random(), typ = ich.attacken.spezial.typ;
    const vor = this.richtungsTaste(ich, true), zurueck = this.richtungsTaste(ich, false);
    if (Math.random() < s.fehler) { // absichtlicher Fehler
      waehle([() => this.halteFuer(vor, 20), () => this.halteFuer(zurueck, 15), () => this.druecke('schwer'), () => this.druecke('hoch'), () => this.halteFuer('runter', 20)])();
      return;
    }
    if (ich.energie >= MAX_ENERGIE && Math.random() < s.aggro * 0.6) {
      const st = ich.attacken.superA.typ;
      const passt = st === 'geschoss' || st === 'welle' || st === 'regen' || (st === 'boden' && g.amBoden()) || dist < 380;
      if (passt) { this.druecke('super'); return; }
    }
    if (dist < 185) {
      if (r < 0.34) { this.druecke('leicht'); this.druecke('leicht', 11); if (Math.random() < s.aggro) this.druecke('leicht', 22); }
      else if (r < 0.52) this.druecke('schwer');
      else if (r < 0.62) { this.halteFuer('runter', 14); this.druecke(Math.random() < 0.5 ? 'leicht' : 'schwer', 2); }
      else if (r < 0.72 && ich.spezialCD <= 0 && (typ === 'nah' || typ === 'feger' || typ === 'dash')) this.druecke('spezial');
      else if (r < 0.84) this.halteFuer('block', 18);
      else { this.halteFuer(zurueck, 18); }
    } else if (dist < 330) {
      if (r < 0.3 * s.aggro + 0.1 && ich.spezialCD <= 0 && (typ === 'dash' || (typ === 'feger' && dist < 230))) this.druecke('spezial');
      else if (r < 0.5) { this.halteFuer(vor, 12); this.druecke('hoch'); this.druecke(Math.random() < 0.5 ? 'schwer' : 'leicht', 14); }
      else if (r < 0.5 + s.aggro * 0.4) this.halteFuer(vor, 16);
      else if (typ === 'geschoss' && ich.spezialCD <= 0) this.druecke('spezial');
      else this.halteFuer('block', 14);
    } else {
      if (typ === 'geschoss' && ich.spezialCD <= 0 && r < 0.45) this.druecke('spezial');
      else if (r < 0.18) { this.halteFuer(vor, 10); this.druecke('hoch'); }
      else this.halteFuer(vor, 22);
    }
  }
}

/* =====================================================================
   9. KÄMPFER: PHYSIK UND KAMPFLOGIK
   ===================================================================== */
class Kaempfer {
  constructor(def, seite, steuer) {
    this.def = def; this.seite = seite; this.steuer = steuer; this.siege = 0; this.energie = 0;
    this.attacken = erstelleAttacken(def.id);
    this.hoehe = def.typ === 'buste' ? def.hoehe + def.beine - 18 : def.hoehe;
    this.sprungKraft = 16.5 + def.tempo * 0.45;
    this.gehTempo = 2.8 + def.tempo * 0.6;
    this.zuruecksetzen();
  }
  zuruecksetzen() {
    this.x = BUEHNEN_BREITE / 2 + (this.seite === 0 ? -250 : 250); this.y = BODEN; this.vx = 0; this.vy = 0;
    this.richtung = this.seite === 0 ? 1 : -1;
    this.lp = MAX_LP; this.lpAnzeige = MAX_LP; this.lpVerz = 0;
    this.zustand = 'stand'; this.zt = 0; this.angriff = null; this.stunDauer = 0;
    this.unverw = 0; this.blitz = 0; this.kette = 0; this.ketteTimer = 0; this.spezialCD = 0;
    this.combo = 0; this.comboAnzeige = 0; this.comboTimer = 0; this.anim = Math.random() * 100; this.laufPhase = 0;
    this.luftAngriffGenutzt = false; this.geschoss = null; this.spur = []; this.hitstop = 0;
    if (this.steuer.leeren) this.steuer.leeren();
  }
  amBoden() { return this.y >= BODEN - 0.5; }
  frei() { return ['stand', 'lauf', 'ducken', 'block'].includes(this.zustand); }
  duckt() { return this.zustand === 'ducken' || (this.zustand === 'block' && this.steuer.gehalten('runter')) || (this.zustand === 'blockstun' && this.steuer.gehalten('runter')) || (this.angriff && this.angriff.m.tief); }
  koerperHoehe() { return this.duckt() ? this.hoehe * 0.62 : (this.zustand === 'liegen' || this.zustand === 'ko' ? 40 : this.hoehe); }
  hurtbox() { const b = this.def.breite, h = this.koerperHoehe(); return { x: this.x - b / 2, y: this.y - h, w: b, h }; }
  blocktBereit() {
    if (!this.amBoden()) return false;
    if (this.zustand === 'block' || this.zustand === 'blockstun') return true;
    return this.steuer.gehalten('block') && ['stand', 'lauf', 'ducken'].includes(this.zustand);
  }
  richtungsEingabe() { return (this.steuer.gehalten('rechts') ? 1 : 0) - (this.steuer.gehalten('links') ? 1 : 0); }

  starteAngriff(m, kampf) {
    this.zustand = 'angriff'; this.zt = 0;
    this.angriff = { m, t: 0, trefferZahl: 0, naechster: 0 };
    if (!m.luft) this.vx = 0;
    if (m.beiStart) m.beiStart(this, kampf);
    if (m.klang) Klang.spiele(m.klang); else Klang.spiele('schlag');
  }

  aktualisiere(g, kampf) {
    const st = this.steuer;
    if (this.blitz > 0) this.blitz--;
    if (this.unverw > 0) this.unverw--;
    if (this.spezialCD > 0) this.spezialCD--;
    if (this.ketteTimer > 0 && --this.ketteTimer === 0) this.kette = 0;
    if (this.comboTimer > 0 && --this.comboTimer === 0) this.comboAnzeige = 0;
    this.zt++; this.anim++;
    if (!['treffer', 'fallen'].includes(g.zustand) && g.zustand !== 'gefesselt') this.combo = 0;

    // Zum Gegner drehen (nur wenn frei und am Boden)
    if (this.frei() && this.amBoden() && Math.abs(g.x - this.x) > 8) this.richtung = g.x > this.x ? 1 : -1;

    const kampfLaeuft = kampf.phase === 'kampf';
    if (this.frei() && kampfLaeuft) this.freieAktion(g, kampf);
    else if (this.frei()) { this.zustand = 'stand'; this.vx *= 0.7; }

    switch (this.zustand) {
      case 'sprung':
        if (kampfLaeuft && !this.luftAngriffGenutzt) {
          if (st.nimm('schwer')) { this.luftAngriffGenutzt = true; this.starteAngriff(GRUNDANGRIFFE.luftSchwer, kampf); }
          else if (st.nimm('leicht')) { this.luftAngriffGenutzt = true; this.starteAngriff(GRUNDANGRIFFE.luftLeicht, kampf); }
        }
        break;
      case 'angriff': this.angriffAktualisieren(g, kampf); break;
      case 'treffer': case 'blockstun':
        this.vx *= 0.86;
        if (this.zt >= this.stunDauer) this.zustand = 'stand';
        break;
      case 'liegen':
        this.vx *= 0.8; this.unverw = 2;
        if (this.lp <= 0) this.zustand = 'ko';
        else if (this.zt > 38) { this.zustand = 'aufstehen'; this.zt = 0; this.unverw = 22; }
        break;
      case 'aufstehen': if (this.zt > 12) this.zustand = 'stand'; break;
      case 'ko': this.vx *= 0.85; break;
    }

    // Physik
    if (!this.amBoden() || this.vy < 0) {
      this.vy += SCHWERKRAFT; this.y += this.vy;
      if (this.y >= BODEN) this.landen(kampf);
    }
    this.x += this.vx;
    if (this.amBoden() && ['stand', 'ducken', 'block', 'sieg'].includes(this.zustand)) this.vx *= 0.6;
    // Lebensbalken-Verzögerung
    if (this.lpAnzeige > this.lp) { if (this.lpVerz > 0) this.lpVerz--; else this.lpAnzeige = Math.max(this.lp, this.lpAnzeige - 6); }
    // Nachbilder für Sprints
    if (this.angriff && this.angriff.m.spur && this.zt % 2 === 0) this.spur.push({ x: this.x, y: this.y, r: this.richtung, t: 12 });
    this.spur = this.spur.filter(s => --s.t > 0);
  }

  freieAktion(g, kampf) {
    const st = this.steuer, A = this.attacken;
    if (st.nimm('super') && this.energie >= MAX_ENERGIE) { kampf.starteSuper(this); return; }
    if (st.nimm('spezial') && this.spezialCD <= 0 && !(this.geschoss && this.geschoss.lebt)) { this.starteAngriff(A.spezial, kampf); this.spezialCD = 40; return; }
    const duck = st.gehalten('runter');
    if (st.nimm('schwer')) { this.starteAngriff(duck ? GRUNDANGRIFFE.tiefSchwer : GRUNDANGRIFFE.schwer, kampf); return; }
    if (st.nimm('leicht')) {
      if (this.kette >= 2 && !duck) { this.kette = 0; this.starteAngriff(GRUNDANGRIFFE.finisher, kampf); }
      else this.starteAngriff(duck ? GRUNDANGRIFFE.tiefLeicht : GRUNDANGRIFFE.leicht, kampf);
      return;
    }
    const dir = this.richtungsEingabe();
    if (st.gehalten('hoch') && this.amBoden()) {
      this.zustand = 'sprung'; this.zt = 0; this.vy = -this.sprungKraft; this.vx = dir * this.gehTempo * 1.2; this.luftAngriffGenutzt = false;
      Klang.spiele('sprung'); return;
    }
    if (st.gehalten('block')) { this.zustand = 'block'; this.vx = 0; return; }
    if (duck) { this.zustand = 'ducken'; this.vx = 0; return; }
    if (dir) { this.zustand = 'lauf'; const vorwaerts = dir === this.richtung; this.vx = dir * this.gehTempo * (vorwaerts ? 1 : 0.78); this.laufPhase += 0.22 * (vorwaerts ? 1 : -1); return; }
    this.zustand = 'stand';
  }

  angriffAktualisieren(g, kampf) {
    const a = this.angriff, m = a.m;
    // Schattenwirbel-Serie (Tigris-Super): Phase eingefroren, 6 Hiebe
    if (a.serie) {
      a.serie.t++;
      if (a.serie.t % 7 === 0) {
        a.serie.n++;
        if (g.lp <= 0 || !['treffer', 'gefesselt'].includes(g.zustand)) { a.serie = null; a.t = m.start + m.aktiv; return; }
        const seite = a.serie.n % 2 ? -1 : 1;
        this.spur.push({ x: this.x, y: this.y, r: this.richtung, t: 14 });
        this.x = g.x + seite * 150; this.richtung = -seite;
        const letzter = a.serie.n >= 6;
        wendeTrefferAn(this, g, letzter ? { schaden: 60, unblockbar: true, umwerfen: true, knock: 14, stop: 12, wackeln: 12 } : { schaden: 36, unblockbar: true, stun: 40, knock: 0, stop: 3 }, this.richtung, kampf);
        kampf.effekte.push({ typ: 'hieb', x: g.x, y: g.y - g.hoehe * 0.55, r: 110, dir: this.richtung, farbe: this.def.farbe, t: 0, dauer: 10, gross: true, dreh: Math.random() * 6 });
        if (letzter) { a.serie = null; a.t = m.start + m.aktiv; }
      }
      return;
    }
    a.t++;
    const phase = a.t - m.start;
    if (phase === 0) {
      if (m.geschoss) { const p = m.geschoss(this); kampf.geschosse.push(p); if (!m.superFlag) this.geschoss = p; }
      if (m.fx) kampf.effekte.push({ typ: m.fx === 'feger' || m.fx === 'tief' ? 'feger' : 'hieb', x: this.x + this.richtung * (m.reichweite || 100) * 0.62, y: this.y - this.hoehe * ((m.hoehe ? (m.hoehe[0] + m.hoehe[1]) / 2 : 0.5)), r: (m.reichweite || 100) * 0.55, dir: this.richtung, farbe: m.fx === 'klein' || m.fx === 'tief' ? '#fff' : this.def.farbe, t: 0, dauer: m.fx === 'klein' ? 7 : 11, gross: m.fx !== 'klein' && m.fx !== 'tief', dreh: 0, bruch: m.luft });
    }
    if (phase >= 0 && phase < m.aktiv) {
      if (m.schub) this.vx = this.richtung * m.schub;
      if (m.beiAktiv) m.beiAktiv(this, kampf, phase);
    } else if (phase >= m.aktiv && m.schub && this.amBoden()) this.vx *= 0.7;
    if (a.t >= m.start + m.aktiv + m.erholung) {
      this.angriff = null;
      this.zustand = this.amBoden() ? 'stand' : 'sprung';
    }
  }

  landen(kampf) {
    this.y = BODEN; this.vy = 0;
    if (this.zustand === 'fallen') {
      this.zustand = this.lp <= 0 ? 'ko' : 'liegen'; this.zt = 0; kampf.wackeln = Math.max(kampf.wackeln, 6);
      for (let i = 0; i < 8; i++) kampf.partikel.push(tintenTropfen(this.x + zufall(-60, 60), BODEN, '#111', zufall(4, 9), -zufall(2, 7)));
    } else if (this.zustand === 'sprung' || (this.zustand === 'angriff' && this.angriff && this.angriff.m.luft)) {
      this.zustand = 'stand'; this.angriff = null; this.vx = 0;
    }
  }
}

// Trefferbox eines Angriffs (Weltkoordinaten)
function trefferbox(k, m) {
  const dir = k.richtung;
  const vorn = k.x + dir * (m.reichweite || 100), hinten = k.x - dir * (m.rueckwaerts || -k.def.breite * 0.1);
  const x1 = Math.min(vorn, hinten), x2 = Math.max(vorn, hinten);
  const h = m.hoehe || [0.3, 0.8];
  return { x: x1, y: k.y - k.hoehe * h[1], w: x2 - x1, h: k.hoehe * (h[1] - h[0]) };
}

// Zentrale Schadensberechnung – für Nahkampf und Projektile
function wendeTrefferAn(a, d, m, dir, kampf) {
  let geblockt = false;
  if (!m.unblockbar && d.blocktBereit()) {
    const duck = d.duckt();
    if (m.stufe === 'tief') geblockt = duck;
    else if (m.stufe === 'hoch') geblockt = !duck;
    else geblockt = true;
  }
  let schaden = m.schaden * (0.8 + 0.1 * a.def.kraft) * (1.14 - 0.07 * d.def.vert);
  const kx = d.x - dir * d.def.breite * 0.3, ky = d.y - d.koerperHoehe() * 0.6;
  if (geblockt) {
    schaden *= 0.2;
    d.lp = Math.max(1, d.lp - schaden); d.lpVerz = 30;
    d.zustand = 'blockstun'; d.zt = 0; d.stunDauer = m.blockstun || 10; d.vx = dir * (m.knock || 4) * 0.9; d.angriff = null;
    a.energie = Math.min(MAX_ENERGIE, a.energie + 3); d.energie = Math.min(MAX_ENERGIE, d.energie + 4);
    kampf.hitstop = Math.max(kampf.hitstop, 4);
    kampf.effekte.push({ typ: 'schild', x: d.x + dir * -1 * d.def.breite * 0.55, y: d.y - d.koerperHoehe() * 0.55, r: d.koerperHoehe() * 0.45, dir: -dir, t: 0, dauer: 10 });
    for (let i = 0; i < 5; i++) kampf.partikel.push(tintenTropfen(kx, ky, '#fff', zufall(2, 4), -zufall(2, 6), -dir * zufall(1, 5)));
    Klang.spiele('block');
    return 'block';
  }
  schaden = Math.round(schaden);
  const warInStun = ['treffer', 'fallen', 'gefesselt'].includes(d.zustand);
  a.combo = warInStun ? a.combo + 1 : 1;
  if (a.combo >= 2) { a.comboAnzeige = a.combo; a.comboTimer = 70; }
  d.lp -= schaden; d.lpVerz = 40; d.blitz = 7; d.angriff = null;
  if (m.kette) { a.kette++; a.ketteTimer = 45; }
  if (d.lp <= 0) {
    d.lp = 0; d.zustand = 'fallen'; d.zt = 0; d.vy = -11; d.vx = dir * 9; kampf.koEintritt(a, d);
  } else if (m.umwerfen || !d.amBoden()) {
    d.zustand = 'fallen'; d.zt = 0; d.vy = m.hochwurf || (d.amBoden() ? -8 : Math.min(d.vy, -5)); d.vx = dir * (m.knock || 7);
  } else {
    d.zustand = 'treffer'; d.zt = 0; d.stunDauer = m.stun || 16; d.vx = dir * (m.knock || 4);
  }
  a.energie = Math.min(MAX_ENERGIE, a.energie + 7 + schaden * 0.03); d.energie = Math.min(MAX_ENERGIE, d.energie + 5);
  kampf.hitstop = Math.max(kampf.hitstop, m.stop || 5);
  if (m.wackeln) kampf.wackeln = Math.max(kampf.wackeln, m.wackeln);
  const menge = Math.min(22, 6 + schaden / 8);
  for (let i = 0; i < menge; i++) kampf.partikel.push(tintenTropfen(kx, ky, Math.random() < 0.35 ? ROT : '#0a0a0a', zufall(3, 8), -zufall(2, 9), dir * zufall(1, 9)));
  kampf.effekte.push({ typ: 'klecks', x: kx, y: ky, r: 18 + schaden / 5, t: 0, dauer: 14, seed: Math.floor(Math.random() * 999), farbe: schaden > 70 ? ROT : '#111' });
  kampf.zahlen.push({ x: kx, y: ky - 40, wert: schaden, t: 0, farbe: schaden >= 80 ? ROT : '#fff' });
  Klang.spiele(schaden >= 70 ? 'trefferHart' : 'treffer');
  return 'treffer';
}

function tintenTropfen(x, y, farbe, r, vy = -5, vx = zufall(-5, 5)) {
  return { x, y, vx, vy, r, farbe, t: 0, leben: 40 + Math.random() * 30 };
}

/* ---------- Projektile ---------- */
class Geschoss {
  constructor(o) { Object.assign(this, { vy: 0, t: 0, leben: 180, trefferZahl: 0, maxTreffer: 1, intervall: 999, naechster: 0, lebt: true }, o); this.startRichtung = Math.sign(this.vx) || 1; }
  box() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
  aktualisiere(kampf) {
    this.t++;
    if (this.rueck) { // Bumerang
      this.vx = this.startRichtung * 13 * Math.cos(this.t * Math.PI / 70);
      if (this.t === 35) { this.trefferZahl = 0; }
      if (this.t > 40 && Math.abs(this.x - this.besitzer.x) < 50 && Math.abs(this.y - (this.besitzer.y - this.besitzer.hoehe * 0.6)) < 120) this.lebt = false;
      this.y += ((this.besitzer.y - this.besitzer.hoehe * 0.62) - this.y) * 0.05;
    }
    if (this.welle) this.w += 60;
    if (this.art === 'bluete') { this.dreh += 0.15; if (this.y > BODEN - 20) { this.lebt = false; for (let i = 0; i < 5; i++) kampf.partikel.push(tintenTropfen(this.x, BODEN - 5, '#ff2d8f', zufall(2, 5), -zufall(1, 5))); } }
    this.x += this.vx; this.y += this.vy;
    if (--this.leben <= 0 || this.x < -200 || this.x > BUEHNEN_BREITE + 200) this.lebt = false;
  }
}

/* =====================================================================
   10. ARENEN (prozedural gezeichnet + Mondtal aus Bild)
   ===================================================================== */
const arenaDeko = (() => {
  const r = saatZufall(42);
  return {
    sterne: Array.from({ length: 120 }, () => ({ x: r() * 2200, y: r() * 380, s: r() * 2 + 0.5, p: r() * 6 })),
    publikum: Array.from({ length: 60 }, (_, i) => ({ x: i * 34 + r() * 10, h: 30 + r() * 30, p: r() * 6 })),
    tropfen: Array.from({ length: 26 }, () => ({ x: r() * 2400, y: r() * 600, v: 2 + r() * 4, l: 20 + r() * 50 })),
    palmen: [{ x: 120, s: 1.1 }, { x: 520, s: 0.8 }, { x: 1500, s: 1.2 }, { x: 1950, s: 0.9 }],
    risse: Array.from({ length: 30 }, () => ({ x: r() * 2400, w: 20 + r() * 80 }))
  };
})();

function zeichneArena(id, camX, t, c = ctx) {
  const par = f => -camX * f;
  c.save();
  switch (id) {
    case 'mondtal': {
      c.fillStyle = '#000'; c.fillRect(0, 0, BREITE, HOEHE);
      const img = BILDER.mondtal;
      if (img) {
        const tw = img.width * 1.05, th = img.height * 1.05, y0 = BODEN + 12 - 600 * 1.05;
        const basis = BREITE / 2 - tw / 2 + par(0.45) + (BUEHNEN_BREITE - BREITE) / 2 * 0.45;
        for (let i = -2; i <= 2; i++) {
          c.save(); c.translate(basis + i * tw, y0);
          if (i % 2) { c.translate(tw, 0); c.scale(-1, 1); }
          c.drawImage(img, 0, 0, tw, th); c.restore();
        }
        c.fillStyle = '#6d6d6d'; c.fillRect(0, y0 + th - 2, BREITE, HOEHE);
        const dunkel = c.createLinearGradient(0, 0, 0, BODEN);
        dunkel.addColorStop(0, 'rgba(0,0,0,0.55)'); dunkel.addColorStop(1, 'rgba(0,0,0,0.3)');
        c.fillStyle = dunkel; c.fillRect(0, 0, BREITE, BODEN);
        if (BILDER.mond) c.drawImage(BILDER.mond, 150 + par(0.05), 40, 110, 130);
      }
      const g = c.createLinearGradient(0, BODEN - 20, 0, HOEHE); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
      c.fillStyle = g; c.fillRect(0, BODEN - 20, BREITE, HOEHE);
      break;
    }
    case 'buehne': {
      const g = c.createLinearGradient(0, 0, 0, HOEHE); g.addColorStop(0, '#050505'); g.addColorStop(1, '#1b1b1b');
      c.fillStyle = g; c.fillRect(0, 0, BREITE, HOEHE);
      // Traversen
      c.strokeStyle = '#444'; c.lineWidth = 3;
      for (let y of [40, 70]) { c.beginPath(); c.moveTo(0, y); c.lineTo(BREITE, y); c.stroke(); }
      for (let x = par(0.8) % 30; x < BREITE; x += 30) { c.beginPath(); c.moveTo(x, 40); c.lineTo(x + 30, 70); c.stroke(); }
      // Scheinwerferkegel
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 5; i++) {
        const sx = 160 + i * 240, w = Math.sin(t * 0.012 + i * 1.7) * 0.5;
        const ex = sx + Math.sin(w) * 700, farbe = i % 2 ? 'rgba(255,40,40,' : 'rgba(255,255,255,';
        const lg = c.createLinearGradient(sx, 70, ex, BODEN);
        lg.addColorStop(0, farbe + '0.28)'); lg.addColorStop(1, farbe + '0)');
        c.fillStyle = lg; c.beginPath(); c.moveTo(sx - 8, 70); c.lineTo(sx + 8, 70); c.lineTo(ex + 140, BODEN); c.lineTo(ex - 140, BODEN); c.fill();
      }
      c.globalCompositeOperation = 'source-over';
      // Boxentürme
      for (let i = -1; i < 8; i++) {
        const x = i * 300 + par(0.6) + 40;
        c.fillStyle = '#0d0d0d'; c.fillRect(x, 330, 150, 300); c.strokeStyle = '#555'; c.lineWidth = 3; c.strokeRect(x, 330, 150, 300);

    }
    case 'tempel': {

      // Tempeltor mit rotem Siegel

      c.strokeStyle = '#8a8a8a'; c.lineWidth = 6; c.stroke();
      klecks(c, tx, 320, 52, ROT, 7);
      c.strokeStyle = '#000'; c.lineWidth = 7; c.lineCap = 'round';
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(tx - 22 + i * 16, 290); c.lineTo(tx + 10 + i * 16, 350); c.stroke(); }
      // nahe Säulen mit Tuschelinien
      for (let i = -1; i < 7; i++) {
        const x = i * 420 + par(0.8) % 420 + 30;
        c.fillStyle = '#8c8c8c'; c.fillRect(x, 0, 90, BODEN);
        c.strokeStyle = '#111'; c.lineWidth = 3; c.strokeRect(x, -5, 90, BODEN + 5);
        c.lineWidth = 2; for (let j = 0; j < 7; j++) { c.beginPath(); c.moveTo(x + 10 + j * 11, 30 + (j * 53) % 120); c.lineTo(x + 18 + j * 9, BODEN - 40 - (j * 37) % 90); c.stroke(); }
        c.fillStyle = '#111'; c.fillRect(x - 12, 0, 114, 34); c.fillRect(x - 12, BODEN - 26, 114, 26);
        // Laterne
        const sw = Math.sin(t * 0.03 + i) * 0.12;
        c.save(); c.translate(x + 45, 34); c.rotate(sw); c.strokeStyle = '#111'; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 80); c.stroke();
        c.fillStyle = ROT; c.beginPath(); c.ellipse(0, 110, 26, 34, 0, 0, 7); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 3; c.stroke(); c.restore();
      }
      // tropfende Tinte von oben
      c.fillStyle = '#000';
      for (const d of arenaDeko.tropfen) {
        const x = ((d.x + par(0.7)) % 1400 + 1400) % 1400 - 60, y = (d.y + t * d.v) % 700;
        c.fillRect(x, 0, 5, d.l * 0.6); c.beginPath(); c.ellipse(x + 2.5, y, 5, 9, 0, 0, 7); c.fill();
      }
      // Steinboden
      c.fillStyle = '#9a9a9a'; c.fillRect(0, BODEN, BREITE, HOEHE - BODEN);
      c.strokeStyle = '#2a2a2a'; c.lineWidth = 3;
      for (let x = par(1) % 160 - 160; x < BREITE + 160; x += 160) { c.beginPath(); c.moveTo(x, BODEN); c.lineTo(x - 60, HOEHE); c.stroke(); }
      c.beginPath(); c.moveTo(0, BODEN + 40); c.lineTo(BREITE, BODEN + 40); c.stroke();
      c.fillStyle = '#111'; c.fillRect(0, BODEN, BREITE, 5);
      break;
    }
    case 'strand': {
      const g = c.createLinearGradient(0, 0, 0, 470); g.addColorStop(0, '#02030a'); g.addColorStop(1, '#16202f');
      c.fillStyle = g; c.fillRect(0, 0, BREITE, HOEHE);
      for (const s of arenaDeko.sterne) { const x = ((s.x + par(0.08)) % 1400 + 1400) % 1400 - 60; c.globalAlpha = 0.5 + Math.sin(t * 0.05 + s.p) * 0.4; c.fillStyle = '#fff'; c.fillRect(x, s.y, s.s, s.s); }
      c.globalAlpha = 1;
      const mx = 980 + par(0.1);
      c.fillStyle = '#f2f2ea'; c.beginPath(); c.arc(mx, 150, 70, 0, 7); c.fill();
      c.fillStyle = '#ddd'; c.beginPath(); c.arc(mx - 20, 135, 12, 0, 7); c.arc(mx + 25, 170, 9, 0, 7); c.fill();
      // Meer
      c.fillStyle = '#0a0f18'; c.fillRect(0, 440, BREITE, BODEN - 440);
      c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2;
      for (let i = 0; i < 9; i++) { const y = 455 + i * 20; c.beginPath(); for (let x = 0; x <= BREITE; x += 20) { const yy = y + Math.sin(x * 0.02 + t * 0.04 + i) * 3; x ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.globalAlpha = 0.25 + i * 0.05; c.stroke(); }
      c.globalAlpha = 0.4; c.fillStyle = '#fff'; for (let i = 0; i < 8; i++) c.fillRect(mx - 40 + Math.sin(t * 0.05 + i) * 20, 460 + i * 20, 80 - i * 6, 3); c.globalAlpha = 1;
      // Palmen
      for (const p of arenaDeko.palmen) {
        const x = p.x + par(0.7);
        c.save(); c.translate(x, BODEN); c.scale(p.s, p.s);
        c.strokeStyle = '#000'; c.lineWidth = 22; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(40, -200, 10, -390); c.stroke();
        c.fillStyle = '#000';
        for (let b = 0; b < 7; b++) { const w = b / 7 * Math.PI * 2 + Math.sin(t * 0.02) * 0.08; c.save(); c.translate(10, -390); c.rotate(w); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(90, -40, 170, 30); c.quadraticCurveTo(90, -5, 0, 10); c.fill(); c.restore(); }
        for (let b = 0; b < 3; b++) zeichneBluete(c, -40 + b * 40, -30 - b * 12, 16, b);
        c.restore();
      }
      // Sand
      c.fillStyle = '#b9b2a2'; c.fillRect(0, BODEN, BREITE, HOEHE - BODEN);
      c.fillStyle = '#958e7f'; for (let i = 0; i < 60; i++) { const x = ((i * 97 + par(1)) % 1400 + 1400) % 1400 - 60; c.fillRect(x, BODEN + 10 + (i * 37) % 70, 6, 3); }
      c.fillStyle = '#111'; c.fillRect(0, BODEN, BREITE, 4);

}

function zeichneVordergrund(id, camX, t) {

function zeichneBluete(c, x, y, r, drehung = 0) {
  c.save(); c.translate(x, y); c.rotate(drehung);
  c.fillStyle = '#ff2d8f'; c.strokeStyle = '#000'; c.lineWidth = 2;
  for (let i = 0; i < 5; i++) { c.save(); c.rotate(i / 5 * Math.PI * 2); c.beginPath(); c.ellipse(0, -r * 0.6, r * 0.45, r * 0.7, 0, 0, 7); c.fill(); c.stroke(); c.restore(); }
  c.fillStyle = '#ffd400'; c.beginPath(); c.arc(0, 0, r * 0.2, 0, 7); c.fill(); c.stroke();
  c.restore();
}

// Vorschaubilder der Arenen (einmalig gerendert)
const arenaVorschau = {};
function erstelleArenaVorschau() {
  for (const a of ARENEN) {
    const c = neueLeinwand(BREITE, HOEHE);
    zeichneArena(a.id, (BUEHNEN_BREITE - BREITE) / 2, 0, c.getContext('2d'));
    const k = neueLeinwand(320, 180); k.getContext('2d').drawImage(c, 0, 0, 320, 180);
    arenaVorschau[a.id] = k;
  }
}

/* =====================================================================
   11. RENDERING DER KÄMPFER UND EFFEKTE
   ===================================================================== */
function zeichneKaempfer(k, camX, kampf) {
  const def = k.def, sp = SPRITES[def.id];
  const bild = sp.normal;
  const bust = def.typ === 'buste';
  const bildH = def.hoehe, bildW = bild.width * bildH / bild.height;
  let sx = 1, sy = 1, rot = 0, ox = 0, oy = 0, alpha = 1, variante = bild;
  const t = k.anim;
  switch (k.zustand) {
    case 'stand': case 'block': sy = 1 + Math.sin(t * 0.08) * 0.015; sx = 1 - Math.sin(t * 0.08) * 0.008; break;
    case 'lauf': oy = -Math.abs(Math.sin(k.laufPhase)) * 10; rot = Math.sin(k.laufPhase) * 0.04 + 0.04; break;
    case 'sprung': sy = 1 + begrenze(-k.vy * 0.008, -0.08, 0.1); sx = 1 / sy; rot = 0.08; break;
    case 'ducken': sy = 0.64; sx = 1.1; break;
    case 'treffer': case 'blockstun': rot = -0.12; ox = -8; break;
    case 'fallen': rot = -0.6 - (k.zt * 0.04); break;
    case 'liegen': case 'ko': rot = -Math.PI / 2 + 0.05; oy = -def.anker * bildW * 0.85; alpha = k.zustand === 'ko' ? 0.9 : 1; break;
    case 'aufstehen': rot = -Math.PI / 2 * (1 - k.zt / 12); oy = -def.anker * bildW * 0.85 * (1 - k.zt / 12); break;
    case 'sieg': oy = -Math.abs(Math.sin(t * 0.1)) * 26; sy = 1.03; break;
    case 'angriff': {
      const a = k.angriff, m = a.m, p = a.t - m.start;
      if (m.tief) { sy = 0.64; sx = 1.1; }
      if (p < 0) { rot = -0.06 * (a.t / m.start); ox = -6; }
      else if (p < m.aktiv) { rot = m.luft ? 0.25 : 0.13; ox = 22; }
      else { rot = 0.05; ox = 8; }
      if (m.fx === 'wirbel' || m.fx === 'laserwirbel') { if (p >= 0 && p < m.aktiv) sx = Math.cos(a.t * 0.55); }
      if (m.fx === 'feger' && p >= 0 && p < m.aktiv + 4) { sx = Math.cos(a.t * 0.6); }
      if (a.serie) { rot = 0.2; }
      break;
    }
  }
  if (k.blitz > 0) variante = k.blitz % 4 < 2 ? sp.rot : sp.weiss;
  if (k.unverw > 0 && ['aufstehen', 'stand', 'lauf'].includes(k.zustand) && Math.floor(k.unverw / 3) % 2) alpha = 0.55;

  const bx = k.x - camX, by = k.y;
  // Nachbilder
  for (const s of k.spur) {
    ctx.save(); ctx.globalAlpha = s.t / 55; ctx.translate(s.x - camX, s.y); ctx.scale(s.r * def.blick, 1);
    ctx.drawImage(sp.schatten, -def.anker * bildW, -(bust ? def.beine + bildH - 18 : bildH), bildW, bildH); ctx.restore();
  }
  // Schatten am Boden
  ctx.save(); ctx.globalAlpha = 0.45 * begrenze(1 - (BODEN - k.y) / 400, 0.2, 1); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(bx, BODEN + 4, def.breite * 0.7, 12, 0, 0, 7); ctx.fill(); ctx.restore();

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(bx, by + oy);
  ctx.scale(k.richtung, 1);          // Blickrichtung
  ctx.rotate(rot);
  ctx.translate(ox, 0);
  ctx.scale(sx, sy);
  if (bust) zeichneBeine(k, def, bildH);
  if (def.blick < 0) ctx.scale(-1, 1); // Bild schaut von Natur aus nach links
  const yOben = bust ? -(def.beine + bildH - 18) : -bildH;
  ctx.drawImage(variante, -def.anker * bildW, yOben, bildW, bildH);
  if (def.blick < 0) ctx.scale(-1, 1);
  if (bust && k.zustand === 'angriff') zeichneArm(k, def, bildH);
  ctx.restore();

  // Block-Schild
  if (k.zustand === 'block' || k.zustand === 'blockstun') {
    const h = k.koerperHoehe();
    ctx.save(); ctx.translate(bx + k.richtung * def.breite * 0.55, by - h * 0.5);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 5; ctx.setLineDash([14, 8]);
    ctx.beginPath(); ctx.ellipse(0, 0, 22, h * 0.5, 0, 0, 7); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
  // Kombo-Anzeige
  if (k.comboAnzeige >= 2) {
    const x = k.seite === 0 ? 150 : BREITE - 150;
    text(k.comboAnzeige + ' TREFFER', x, 250, 42 + Math.min(20, k.comboTimer > 60 ? (k.comboTimer - 60) * 2 : 0), ROT, 'center', 7);
  }
}

// Beine und Mantelsaum für Büsten-Charaktere (Kapuzen-Orden)
function zeichneBeine(k, def, bildH) {
  const L = def.beine;
  const laufend = k.zustand === 'lauf';
  const sw = laufend ? Math.sin(k.laufPhase) * 20 : (k.zustand === 'sprung' ? 10 : 0);
  ctx.lineCap = 'round';
  for (const [seite, phase] of [[-1, 1], [1, -1]]) {
    const hx = seite * 16, fx = seite * 22 + sw * phase, knieX = (hx + fx) / 2 + 8, knieY = -L * 0.5 - (k.zustand === 'sprung' ? 16 : 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 24; ctx.beginPath(); ctx.moveTo(hx, -L); ctx.lineTo(knieX, knieY); ctx.lineTo(fx, -4); ctx.stroke();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 17; ctx.beginPath(); ctx.moveTo(hx, -L); ctx.lineTo(knieX, knieY); ctx.lineTo(fx, -4); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(fx + 10, -5, 20, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  // dunkler, zerrissener Mantel mit Tintentropfen
  const oben = -L - 40, unten = -L * 0.42;
  ctx.fillStyle = '#1c1c1c'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-44, oben); ctx.lineTo(44, oben);
  const zacken = 8;
  for (let i = 0; i <= zacken; i++) {
    const x = 50 - i * (100 / zacken), tiefe = unten + ((i * 37) % 5) * 6 + Math.sin(k.anim * 0.1 + i) * 3;
    ctx.lineTo(x + (laufend ? -sw * 0.3 : 0), tiefe);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-30 + i * 20, oben + 6); ctx.lineTo(-34 + i * 22, unten - 4); ctx.stroke(); }
  ctx.fillStyle = '#000';
  for (let i = 0; i < 4; i++) { const x = -34 + i * 22, l = 10 + ((i * 13 + Math.floor(k.anim / 20)) % 14); ctx.fillRect(x, unten - 2, 4, l); ctx.beginPath(); ctx.arc(x + 2, unten - 2 + l, 3.5, 0, 7); ctx.fill(); }
}

// Arm mit Krallen während eines Angriffs (Büsten-Charaktere)
function zeichneArm(k, def, bildH) {
  const a = k.angriff, m = a.m, p = a.t - m.start;
  const L = def.beine;
  const reichweite = m.reichweite || 100;
  const f = p < 0 ? 0.35 : p < m.aktiv ? 1 : 0.6;
  const hMitte = m.hoehe ? (m.hoehe[0] + m.hoehe[1]) / 2 : 0.55;
  const sx = 10, sy = -(L + bildH * 0.25), ex = reichweite * 0.85 * f, ey = -k.hoehe * hMitte;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(ex * 0.4, sy + 30, ex, ey); ctx.stroke();
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 19; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(ex * 0.4, sy + 30, ex, ey); ctx.stroke();
  ctx.fillStyle = def.farbe; ctx.beginPath(); ctx.arc(ex, ey, 15, 0, 7); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(ex + 10, ey + i * 8); ctx.lineTo(ex + 30, ey + i * 12 - 4); ctx.stroke(); }
}

function zeichneGeschoss(p, camX, t) {
  const x = p.x - camX, y = p.y;
  ctx.save(); ctx.translate(x, y);
  const d = Math.sign(p.vx) || p.startRichtung;
  switch (p.art) {
    case 'basswelle':
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = i % 2 ? '#fff' : ROT; ctx.lineWidth = 7 - i;
        ctx.beginPath(); ctx.ellipse(-d * i * 16, 10, 22 + i * 6, 40 - i * 4, 0, d > 0 ? -1.3 : Math.PI - 1.3, d > 0 ? 1.3 : Math.PI + 1.3); ctx.stroke();
      }
      ctx.fillStyle = '#000'; for (let i = 0; i < 3; i++) ctx.fillRect(-d * (30 + i * 16), 30 + Math.sin(t * 0.5 + i) * 4, 10, 8);
      break;
    case 'powerchord':
      for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = i % 2 ? '#fff' : ROT; ctx.lineWidth = 12 - i;
        ctx.beginPath(); ctx.ellipse(-d * i * 20, 0, 30 + i * 8, 115 - i * 10, 0, d > 0 ? -1.4 : Math.PI - 1.4, d > 0 ? 1.4 : Math.PI + 1.4); ctx.stroke();
      }
      text('♪', -d * 40, -60 + Math.sin(t * 0.3) * 10, 48, '#fff', 'center', 5); text('♫', -d * 70, 40 + Math.cos(t * 0.3) * 10, 40, ROT, 'center', 5);
      break;
    case 'schwert':
      ctx.rotate(t * 0.45);
      ctx.shadowColor = '#ff3fb4'; ctx.shadowBlur = 25;
      ctx.strokeStyle = '#ff3fb4'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-38, 0); ctx.lineTo(38, 0); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#555'; ctx.fillRect(-10, -5, 20, 10);
      break;
    case 'bluete': zeichneBluete(ctx, 0, 0, 26, p.dreh); break;
    case 'bruellwelle': {
      const r = p.w / 2;
      ctx.translate(0, 150);
      for (let i = 0; i < 3; i++) { ctx.strokeStyle = i === 1 ? '#e8a13a' : (i ? '#fff' : '#000'); ctx.lineWidth = 16 - i * 4; ctx.globalAlpha = Math.max(0, 1 - p.t / 45);
        ctx.beginPath(); ctx.ellipse(0, 0, r - i * 14, 260 - i * 14, 0, Math.PI, Math.PI * 2); ctx.stroke(); }
      break;
    }
  }
  ctx.restore();
}

function zeichneEffekt(e, camX) {
  const x = e.x - camX, f = e.t / e.dauer;
  ctx.save(); ctx.translate(x, e.y);
  switch (e.typ) {
    case 'hieb': {
      ctx.scale(e.dir, 1); ctx.rotate(e.dreh || 0);
      if (e.bruch) ctx.rotate(0.6);
      const r = e.r, breite = e.gross ? 22 : 12;
      ctx.globalAlpha = 1 - f;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000'; ctx.lineWidth = breite + 8; ctx.beginPath(); ctx.arc(-r * 0.3, 0, r, -1.1 + f * 0.6, 1.1 * (0.3 + f)); ctx.stroke();
      ctx.strokeStyle = e.farbe; ctx.lineWidth = breite; ctx.beginPath(); ctx.arc(-r * 0.3, 0, r, -1.1 + f * 0.6, 1.1 * (0.3 + f)); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(-r * 0.3, 0, r - breite * 0.3, -1.0 + f * 0.6, 1.0 * (0.3 + f)); ctx.stroke();
      break;
    }
    case 'feger': {
      ctx.scale(e.dir, 1); ctx.globalAlpha = 1 - f;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 16; ctx.beginPath(); ctx.ellipse(-e.r * 0.2, 12, e.r * 1.1, 26, 0, Math.PI * 0.05, Math.PI * (0.6 + f * 0.4)); ctx.stroke();
      ctx.strokeStyle = e.farbe; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(-e.r * 0.2, 12, e.r * 1.1, 26, 0, Math.PI * 0.05, Math.PI * (0.6 + f * 0.4)); ctx.stroke();
      break;
    }
    case 'klecks':
      ctx.globalAlpha = 1 - f; ctx.scale(0.6 + f * 0.6, 0.6 + f * 0.6); klecks(ctx, 0, 0, e.r, e.farbe, e.seed); break;
    case 'schild':
      ctx.globalAlpha = 1 - f; ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.ellipse(0, 0, 18 + f * 20, e.r, 0, 0, 7); ctx.stroke(); break;
  }
  ctx.restore();
}

// Laserwirbel (Laserbear-Super) direkt am Kämpfer
function zeichneAura(k, camX) {
  if (k.zustand !== 'angriff') return;
  const a = k.angriff, m = a.m, p = a.t - m.start;
  if (m.fx === 'laserwirbel' && p >= 0 && p < m.aktiv) {
    ctx.save(); ctx.translate(k.x - camX, k.y - k.hoehe * 0.5);
    ctx.shadowColor = '#ff3fb4'; ctx.shadowBlur = 30;
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = i === 1 ? '#fff' : '#ff3fb4'; ctx.lineWidth = 10 - i * 3;
      ctx.beginPath(); ctx.ellipse(0, 0, 150, 70 + i * 50, a.t * 0.4 + i, 0, Math.PI * 1.4); ctx.stroke();
    }
    ctx.restore();
  }
  if (m.fx === 'wirbel' && p >= 0 && p < m.aktiv) {
    ctx.save(); ctx.translate(k.x - camX, k.y - k.hoehe * 0.5);
    ctx.strokeStyle = ROT; ctx.lineWidth = 8; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.ellipse(0, 0, 120, 60, 0, a.t * 0.5, a.t * 0.5 + 4); ctx.stroke();
    ctx.restore();
  }
}

// Hintergrund für Menüs: Tintenkleckse
const menueHintergrund = (() => {
  const c = neueLeinwand(BREITE, HOEHE), g = c.getContext('2d');
  g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, BREITE, HOEHE);
  const r = saatZufall(7);
  for (let i = 0; i < 18; i++) klecks(g, r() * BREITE, r() * HOEHE, 20 + r() * 90, i % 5 === 0 ? 'rgba(160,0,0,0.35)' : 'rgba(255,255,255,0.04)', i + 3);
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
  for (let i = 0; i < 60; i++) { g.beginPath(); const y = r() * HOEHE; g.moveTo(0, y); g.lineTo(BREITE, y + (r() - 0.5) * 80); g.stroke(); }
  return c;
})();

function zeichneMenueHintergrund(titel) {

/* ---------- Generisches Menü ---------- */
class MenueSzene {
  constructor(titel, punkte, zurueck) { this.titel = titel; this.punkte = punkte; this.wahl = 0; this.zurueckFn = zurueck; this.t = 0; }

    this.t++;

    if (menueTaste('hoch')) { this.wahl = (this.wahl + n - 1) % n; Klang.spiele('menue'); }
    if (menueTaste('runter')) { this.wahl = (this.wahl + 1) % n; Klang.spiele('menue'); }
    const p = this.punkte[this.wahl];
    if (menueTaste('links') && p.links) { p.links(); Klang.spiele('menue'); }
    if (menueTaste('rechts') && p.rechts) { p.rechts(); Klang.spiele('menue'); }
    if (menueTaste('ok')) { if (p.aktion) { Klang.spiele('ok'); p.aktion(); } else if (p.rechts) { p.rechts(); Klang.spiele('menue'); } }
    else if (menueTaste('zurueck') && this.zurueckFn) { Klang.spiele('zurueck'); this.zurueckFn(); }
  }
  zeichne() {
    zeichneMenueHintergrund(this.titel);

      const label = typeof p.text === 'function' ? p.text() : p.text;

      klickZiel(330, y - 28, 620, 56, () => { this.wahl = i; if (p.aktion) { Klang.spiele('ok'); p.aktion(); } else if (p.rechts) { p.rechts(); Klang.spiele('menue'); } }, () => { this.wahl = i; });
    });

    if (p.info) text(typeof p.info === 'function' ? p.info() : p.info, BREITE / 2, 660, 22, '#999', 'center', 0);
    if (this.zurueckFn) { text('ESC = zurück', 70, 690, 20, '#777', 'left', 0); klickZiel(20, 670, 160, 40, () => { Klang.spiele('zurueck'); this.zurueckFn(); }); }

/* ---------- Tastenbelegung ändern ---------- */
class BelegungSzene {
  constructor(p) { this.p = p; this.wahl = 0; this.wartet = false; }
  aktualisiere() {
    if (this.wartet) return;
    const n = AKTIONEN.length + 1;
    if (neuGedrueckt.has('ArrowUp') || neuGedrueckt.has('KeyW')) { this.wahl = (this.wahl + n - 1) % n; Klang.spiele('menue'); }
    if (neuGedrueckt.has('ArrowDown') || neuGedrueckt.has('KeyS')) { this.wahl = (this.wahl + 1) % n; Klang.spiele('menue'); }
    if (neuGedrueckt.has('Enter') || neuGedrueckt.has('Space')) this.waehle(this.wahl);
    if (neuGedrueckt.has('Escape')) { Klang.spiele('zurueck'); wechsle(OptionenMenue()); }
  }
  waehle(i) {
    if (i === AKTIONEN.length) { wechsle(OptionenMenue()); return; }
    this.wahl = i; this.wartet = true; Klang.spiele('ok');
    wartetAufTaste = code => {
      this.wartet = false;
      if (code === 'Escape') return;
      const a = AKTIONEN[i];
      // Taste bei anderen Aktionen entfernen, damit nichts doppelt belegt ist
      for (const p of ['p1', 'p2']) for (const b of AKTIONEN) {
        if (p === this.p && b === a) continue;
        const liste = spielstand.tasten[p][b].filter(c => c !== code);
        if (liste.length) spielstand.tasten[p][b] = liste;
        else if (spielstand.tasten[p][b].includes(code)) zeigeHinweis('Achtung: ' + tastenName(code) + ' war schon belegt');
      }
      spielstand.tasten[this.p][a] = [code];
      spielTasten = alleSpielTasten(); speichern(); gedrueckt.clear(); Klang.spiele('ok');
    };
  }
  zeichne() {
    zeichneMenueHintergrund(this.p === 'p1' ? 'TASTEN SPIELER 1' : 'TASTEN SPIELER 2');
    AKTIONEN.forEach((a, i) => {
      const y = 160 + i * 48, an = i === this.wahl;
      if (an) { ctx.fillStyle = this.wartet ? '#fff' : ROT; ctx.fillRect(300, y - 22, 680, 44); }
      text(AKTIONS_NAMEN[a], 330, y, 28, an && this.wartet ? '#000' : '#fff', 'left', an && this.wartet ? 0 : 5);
      text(an && this.wartet ? 'Taste drücken …' : tastenListe(this.p, a), 950, y, 28, an && this.wartet ? ROT : '#fff', 'right', an && this.wartet ? 0 : 5);
      klickZiel(300, y - 22, 680, 44, () => { if (!this.wartet) this.waehle(i); });
    });
    const y = 160 + AKTIONEN.length * 48 + 10, an = this.wahl === AKTIONEN.length;
    if (an) { ctx.fillStyle = ROT; ctx.fillRect(300, y - 22, 680, 44); }
    text('ZURÜCK', BREITE / 2, y, 30, '#fff'); klickZiel(300, y - 22, 680, 44, () => this.waehle(AKTIONEN.length));
    text('↑/↓ wählen · ENTER belegen · ESC zurück (Menüsteuerung hier: Pfeile/WASD)', BREITE / 2, 690, 20, '#888', 'center', 0);
  }
}

/* ---------- Charakterauswahl ---------- */
class AuswahlSzene {
  // modus: 'arcade' | 'cpu' | '2p' | 'demo'
  constructor(modus) {
    this.modus = modus; this.t = 0;
    this.c = [{ idx: 0, fertig: false }, { idx: 1, fertig: false }];
    this.cpuWahl = modus === 'cpu' || modus === 'demo'; // Spieler 1 wählt auch den CPU-Gegner
    this.aktiv = 0;
  }
  betreten() { Musik.modus = 'menue'; }
  bewege(c, dx, dy) {
    const n = CHARAKTERE.length, spalten = 3;
    let i = c.idx;
    if (dx) i = Math.floor(i / spalten) * spalten + (i % spalten + dx + spalten) % spalten;
    if (dy) i = (i + dy * spalten + n) % n;
    c.idx = i; Klang.spiele('menue');
  }
  bestaetige(s) {
    const c = this.c[s];
    if (c.fertig) return;
    c.fertig = true; Klang.spiele('ok');
    Klang.spiele(CHARAKTERE[c.idx].klang);
    if (this.cpuWahl && s === 0) { this.aktiv = 1; }
  }
  weiter() {
    const d1 = CHARAKTERE[this.c[0].idx], d2 = CHARAKTERE[this.c[1].idx];
    if (this.modus === 'arcade') { starteArcade(d1); return; }
    wechsle(new ArenaSzene(this.modus, d1, d2));
  }
  aktualisiere() {
    this.t++;
    const T = spielstand.tasten, taste = (p, a) => T[p][a].some(c => neuGedrueckt.has(c));
    const alle = (a) => taste('p1', a) || taste('p2', a);
    if (this.modus === '2p') {
      for (const [s, p] of [[0, 'p1'], [1, 'p2']]) {
        const c = this.c[s];
        if (!c.fertig) {
          if (taste(p, 'links')) this.bewege(c, -1, 0); if (taste(p, 'rechts')) this.bewege(c, 1, 0);
          if (taste(p, 'hoch')) this.bewege(c, 0, -1); if (taste(p, 'runter')) this.bewege(c, 0, 1);
          if (taste(p, 'leicht')) this.bestaetige(s);
        } else if (taste(p, 'schwer')) { c.fertig = false; Klang.spiele('zurueck'); }
      }
      if (neuGedrueckt.has('Escape')) { Klang.spiele('zurueck'); wechsle(HauptMenue()); return; }
    } else {
      const s = this.aktiv, c = this.c[s];
      if (!c.fertig) {
        if (alle('links')) this.bewege(c, -1, 0); if (alle('rechts')) this.bewege(c, 1, 0);
        if (alle('hoch')) this.bewege(c, 0, -1); if (alle('runter')) this.bewege(c, 0, 1);
        if (alle('leicht') || neuGedrueckt.has('Enter') || neuGedrueckt.has('Space')) this.bestaetige(s);
      }
      if (neuGedrueckt.has('Escape') || alle('schwer')) {
        Klang.spiele('zurueck');
        if (s === 1 && !this.c[1].fertig) { this.aktiv = 0; this.c[0].fertig = false; }
        else if (s === 1) this.c[1].fertig = false;
        else if (this.c[0].fertig) this.c[0].fertig = false;
        else { wechsle(HauptMenue()); return; }
      }
    }
    const brauchtZwei = this.modus !== 'arcade';
    if (this.c[0].fertig && (!brauchtZwei || this.c[1].fertig)) {
      this.warte = (this.warte || 0) + 1;
      if (this.warte > 35) this.weiter();
    } else this.warte = 0;
  }
  zeichneDetail(def, x, farbe, label, gespiegelt, fertig) {
    const sp = SPRITES[def.id].normal, h = def.typ === 'buste' ? 330 : 380, w = sp.width * h / sp.height;
    ctx.save(); ctx.translate(x, 700);
    const schau = (gespiegelt ? -1 : 1) * def.blick;
    ctx.scale(schau, 1);
    ctx.drawImage(sp, -w * def.anker, -h, w, h); ctx.restore();
    const tx = gespiegelt ? BREITE - 30 : 30, al = gespiegelt ? 'right' : 'left';
    text(label, tx, 130, 26, farbe, al, 5);
    text(def.name.toUpperCase(), tx, 172, 50, '#fff', al, 8);
    text(def.tier + ' · ' + def.gruppe, tx, 212, 20, '#bbb', al, 4);
    const werte = [['TEMPO', def.tempo], ['KRAFT', def.kraft], ['VERTEIDIGUNG', def.vert]];
    werte.forEach(([n, v], i) => {
      const y = 250 + i * 30;
      text(n, gespiegelt ? tx - 170 : tx, y, 18, '#ddd', al, 3);
      for (let j = 0; j < 5; j++) {
        const bx = gespiegelt ? tx - 26 - j * 26 : tx + 150 + j * 26;
        ctx.fillStyle = j < v ? farbe : '#333'; ctx.fillRect(bx - (gespiegelt ? 0 : 0), y - 9, 22, 18);
      }
    });
    if (fertig) text('BEREIT!', x, 470, 60, farbe, 'center', 8);
  }
  zeichne() {

function umbrechen(str, x, y, groesse, maxB, farbe = '#ccc') {

/* ---------- Kampf starten / Arcade ---------- */

  const gegner = CHARAKTERE.filter(c => c.id !== def.id);

function starteKampf(cfg) {
